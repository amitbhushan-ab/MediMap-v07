      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dcd4ff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="appleVitalityRuby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d79"/>
      <stop offset="100%" stop-color="#ea2261"/>
