      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f0ecff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="applePinVertical" x1="60" y1="24" x2="60" y2="98" gradientUnits="userSpaceOnUse">
