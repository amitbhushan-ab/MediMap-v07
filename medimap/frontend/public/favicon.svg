<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="appleSquircleGrad" x1="16" y1="12" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6754fe"/>
      <stop offset="42%" stop-color="#533afd"/>
      <stop offset="78%" stop-color="#432bd8"/>
      <stop offset="100%" stop-color="#2e19a6"/>
    </linearGradient>
    <radialGradient id="appleCenterGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#8d7eff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#533afd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="appleRimHighlight" x1="60" y1="2" x2="60" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="appleCapsuleHoriz" x1="28" y1="52" x2="92" y2="52" gradientUnits="userSpaceOnUse">
