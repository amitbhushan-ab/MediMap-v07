# Render Blueprint Specification for MediMap
# Docs: https://render.com/docs/blueprint-spec

services:
  # --------------------------------------------------------------------------
  # 1. MediMap Backend API Web Service
  # --------------------------------------------------------------------------
  - type: web
    name: medimap-backend
    runtime: node
    plan: free
    rootDir: medimap/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 2. MediMap Frontend Static Site (SPA with React Router rewrite)
  # --------------------------------------------------------------------------
  - type: web
    name: medimap-frontend
    runtime: static
    rootDir: medimap/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
